<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Library Entry Kiosk</title>
  <meta name="description" content="Self-service library entry and exit kiosk with palm, RFID card and manual code check-in." />
  <link rel="stylesheet" href="/styles.css" />
  <style id="kioskTemplateCss"></style>
  <style id="kioskCustomCss"></style>
</head>
<body>
  <main class="kiosk" id="kioskRoot">
    <section class="panel kiosk-card" id="kioskCard">
      <img id="logo" class="logo kiosk-logo" alt="University logo" hidden />
      <h1 id="institution" class="kiosk-institution">Library</h1>
      <p class="muted kiosk-title" id="title"></p>
      <p class="badge kiosk-name" id="kioskName" hidden></p>

      <div class="clock kiosk-clock" id="clock"></div>
      <p id="welcome" class="kiosk-welcome"></p>

      <div class="tabs kiosk-tabs" id="tabs"></div>

      <form id="scanForm" class="row kiosk-form">
        <input id="code" class="kiosk-input" placeholder="Scan card or type member code" autocomplete="off" />
        <button type="submit">Check in / out</button>
      </form>

      <section id="camera" class="kiosk-camera" hidden>
        <div class="kiosk-video-wrap">
          <video id="video" playsinline muted></video>
          <div class="kiosk-reticle"></div>
        </div>
        <p class="muted" id="cameraHint">Hold the ID card barcode in front of the camera.</p>
        <div class="row kiosk-cam-actions">
          <button type="button" id="camStart">Allow camera</button>
          <button type="button" id="camStop" hidden>Stop camera</button>
        </div>
      </section>


      <div id="result" class="kiosk-result"></div>
      <p class="muted kiosk-footer" id="footer"></p>
    </section>
  </main>
  <section id="idleShow" class="kiosk-idle" hidden aria-hidden="true">
    <div class="kiosk-idle-inner">
      <div class="kiosk-idle-media" id="idleMedia"></div>
      <div class="kiosk-idle-text">
        <p class="kiosk-idle-cat" id="idleCategory"></p>
        <h2 id="idleTitle"></h2>
        <p id="idleBody"></p>
      </div>
      <p class="kiosk-idle-hint">Touch the screen or scan your card to check in / out</p>
      <div class="kiosk-idle-dots" id="idleDots"></div>
    </div>
  </section>
  <script type="module" src="/app/kiosk.js"></script>
</body>
</html>
